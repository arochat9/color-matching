name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-test-screenshot:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test mixing engine
        run: swift test

      - name: Build app for the simulator
        run: |
          xcodebuild -project ColorMatch.xcodeproj -target ColorMatch \
            -sdk iphonesimulator -configuration Debug \
            CODE_SIGNING_ALLOWED=NO SYMROOT="$PWD/build" build | tail -n 40
          test -d build/Debug-iphonesimulator/ColorMatch.app

      - name: Take simulator screenshots
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime, ds in sorted(devices.items(), reverse=True) if "iOS" in runtime for d in ds if d["name"].startswith("iPhone")]
          pro = [d for d in phones if "Pro" in d["name"] and "Max" not in d["name"]]
          print((pro or phones)[0]["udid"])
          ')
          echo "Simulator: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl status_bar "$UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$UDID" build/Debug-iphonesimulator/ColorMatch.app
          mkdir -p screenshots
          shoot() {
            name=$1; shift
            xcrun simctl terminate "$UDID" com.arochat9.ColorMatch 2>/dev/null || true
            xcrun simctl launch "$UDID" com.arochat9.ColorMatch "$@"
            sleep 8
            xcrun simctl io "$UDID" screenshot "screenshots/$name.png"
          }
          shoot 1-mixing -demo mixing -seed 3
          shoot 2-result -demo submitted -seed 3
          shoot 3-named-goal -demo mixing -seed 5 -goalMode named
          shoot 6-library -demo library -seed 1
          # Record the paint-splash animation: the app drips in the goal's recipe, then submits.
          xcrun simctl terminate "$UDID" com.arochat9.ColorMatch 2>/dev/null || true
          xcrun simctl io "$UDID" recordVideo --codec h264 --force screenshots/5-drops.mp4 &
          REC=$!
          sleep 2
          xcrun simctl launch "$UDID" com.arochat9.ColorMatch -demo drops -seed 3
          sleep 14
          kill -INT "$REC"
          wait "$REC" || true
          xcrun simctl ui "$UDID" appearance dark
          shoot 4-result-dark -demo submitted -seed 8
          ls -la screenshots

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      # Also publish the screenshots to the ci-screenshots branch so they can be viewed without
      # downloading the artifact. Skipped for forks, which can't push here.
      - name: Publish screenshots branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          set -euo pipefail
          cd screenshots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
